name: Build Royal Farm APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.royalfarm \
              --project-name royal_farm \
              /tmp/royal_farm_scaffold
            cp -R /tmp/royal_farm_scaffold/android ./android
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Farm-APK
          path: build/app/outputs/flutter-apk/app-release.apk
